name: Publish Xavier RPM feed to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: xavier-rpm-feed-pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'xavier-rpm-feed-')
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble feed from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/site/xavier/scarthgap/armv8a_tegra"
          mkdir -p "$feed" "$RUNNER_TEMP/metadata"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.rpm' \
            --dir "$feed"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'feed-repodata.tar.gz' \
            --dir "$RUNNER_TEMP/metadata"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RPM-GPG-KEY-momonga' \
            --dir "$feed"

          tar -xzf "$RUNNER_TEMP/metadata/feed-repodata.tar.gz" -C "$feed"
          test -s "$feed/repodata/repomd.xml"
          test -s "$feed/RPM-GPG-KEY-momonga"

          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Momonga Xavier RPM feed</title></head>
          <body><h1>Momonga Xavier RPM feed</h1>
          <p>For DNF, use the armv8a_tegra repository path.</p></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: startsWith(github.event.release.tag_name, 'xavier-rpm-feed-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4

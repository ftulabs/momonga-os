name: Publish Momonga RPM feed to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published feed release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: momonga-rpm-feed-pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'momonga-rpm-feed-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install directory-listing template dependency
        run: python -m pip install Jinja2

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble feed from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/site/rpm/momonga/aarch64"
          mkdir -p "$feed" "$RUNNER_TEMP/metadata"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.rpm' \
            --dir "$feed"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'feed-repodata.tar.gz' \
            --dir "$RUNNER_TEMP/metadata"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RPM-GPG-KEY-momonga' \
            --dir "$feed"

          tar -xzf "$RUNNER_TEMP/metadata/feed-repodata.tar.gz" -C "$feed"
          test -s "$feed/repodata/repomd.xml"
          test -s "$feed/repodata/repomd.xml.asc"
          test -s "$feed/RPM-GPG-KEY-momonga"

          python scripts/generate_pages_indexes.py \
            --root "$RUNNER_TEMP/site" \
            --template scripts/templates/pages-directory-index.html.j2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'momonga-rpm-feed-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5

MACHINE = "jetson-agx-xavier-devkit"
DISTRO ?= "poky"
DISTRO_NAME = "Momonga"
DISTRO_VERSION = "1.0"
hostname:pn-base-files = "momonga"
DEFAULT_TIMEZONE = "Asia/Ho_Chi_Minh"
ROOT_HOME = "/root"

DISTRO_FEATURES:append = " systemd usrmerge pam virtualization seccomp vulkan x11"
DISTRO_FEATURES:remove = " wayland directfb 3dfx"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

EXTRA_IMAGE_FEATURES += "tools-sdk tools-debug ssh-server-openssh package-management"
FORTRAN:forcevariable = ",fortran"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
CONF_VERSION = "2"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

IMAGE_ROOTFS_EXTRA_SPACE = "8388608"
LICENSE_FLAGS_ACCEPTED += "commercial"

CORE_IMAGE_EXTRA_INSTALL += " \
    ripgrep vulkan-headers vulkan-loader tegra-libraries-vulkan xauth \
    openssh openssh-sftp-server wired-ethernet-dhcp network-time-sync tzdata \
    tailscale cloudflared \
    cuda-toolkit cuda-cudart cuda-cudart-dev cuda-libraries cuda-nvcc cuda-compiler \
    cudnn tensorrt-core tensorrt-plugins tensorrt-trtexec cuda-compat-12-2 \
    docker-moby docker-compose nvidia-container-toolkit nvidia-docker \
    libnvidia-container-tools libnvidia-container-jetson \
    perf sysstat valgrind strace numactl \
    lapack hdf5 protobuf protobuf-compiler \
    cmake git python3 python3-pip python3-setuptools python3-wheel python3-numpy curl \
    coreutils gawk procps sed \
    packagegroup-rust-sdk-target \
    zstd pigz rsync pciutils usbutils e2fsprogs-mke2fs util-linux \
    tmux bash zsh jq tree sudo shadow btop htop less wget ethtool i2c-tools can-utils \
    nftables ufw mosh mosh-server \
    momonga-branding \
    neofetch \
    "

TOOLCHAIN_TARGET_TASK:append = " vulkan-headers vulkan-loader-dev tegra-libraries-vulkan"

PACKAGECONFIG:append:pn-sudo = " pam-wheel"
PACKAGECONFIG:append:pn-iptables = " libnftnl"
IMAGE_LINGUAS:append = " en-us"

CUDA_ARCHITECTURES = "72"

PREMIRRORS:prepend = " \
    git://nv-tegra.nvidia.com/.* git://github.com/oe4t/ \
    https://nv-tegra.nvidia.com/.* git://github.com/oe4t/ \
"
BB_GIT_SHALLOW = "1"
BB_GIT_SHALLOW:pn-docker-compose = "0"
BB_GIT_SHALLOW_DEPTH = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
FETCHCMD_git = "git -c http.version=HTTP/1.1 -c gc.autoDetach=false -c core.pager=cat -c safe.bareRepository=all"

INHERIT += "root-shell-bash login-motd"
LOGIN_MOTD_FILE = "${TOPDIR}/../config/issue.net"
LOGIN_MOTD_SCRIPT = "${TOPDIR}/../config/login-motd.sh"
LOGIN_MOTD_PROFILE = "${TOPDIR}/../config/login-motd.profile"
ROOTFS_POSTPROCESS_COMMAND:append = " set_root_shell_to_bash; install_login_motd; "

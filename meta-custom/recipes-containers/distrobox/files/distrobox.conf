container_manager="docker"
# Headless host: no desktop launchers. Generating them also fails on images
# whose /etc/os-release is a relative symlink (Ubuntu), which makes create exit 1.
container_generate_entry=0
# Mirror the user's host groups (kvm, video, render...) into every box.
container_init_hook="sh /run/host/etc/distrobox/host-groups.sh \${container_user_name}"
# Docker is shared by all users, so box names are global: default to a
# per-user name. Prefix explicit names with your user name too.
container_name_default="${USER}-box"

# Nobody watches the console: allow five minutes for a console login, then
# reboot instead of waiting in emergency mode. Unverified boots use up the
# slot's UEFI retries, and the boot chain then falls back to the other slot.
[Service]
ExecStart=
ExecStart=-/bin/sh -c '/usr/sbin/sulogin --timeout 300; exec /usr/bin/systemctl --no-block reboot'

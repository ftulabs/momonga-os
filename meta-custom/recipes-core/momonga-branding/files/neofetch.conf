# Momonga ASCII art is supplied by the packaged Neofetch script.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
}

title_fqdn="off"
image_backend="ascii"
ascii_distro="momonga"
gap=7
